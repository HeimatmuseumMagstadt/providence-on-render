# === Backblaze B2 Remote Storage (S3-Compatible) ===

# Basis-URL des B2-Buckets (öffentlich)
remote_media_url = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]"

# Upload-Mapping:
# Wir setzen alle Medienpfade auf die Remote-URL um.
media_root_url = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]"
media_directory = "/var/www/html/media/collectiveaccess" ; bleibt intern, real wird redirect genutzt

# Override der CA-Pfade (Frontend lädt aus Bucket):
images_directory = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]/images"
tilepics_directory = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]/tilepics"
videos_directory = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]/videos"
audio_directory  = "[B2_S3_ENDPOINT]/[B2_BUCKET_NAME]/audio"
